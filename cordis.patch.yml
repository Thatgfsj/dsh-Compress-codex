# dsh-compress-codex — bundle layer (cordis patch).
#
# This file is the `dsh.bundle.patch` of this package: a cordis patch list that
# the loader applies on top of every bundle listed *before* this one in the
# profile's `dsh.profile.bundles`. It never runs standalone — the layer we patch
# is owned by `dsh-base`, whose compaction section is documented in docs/PLAN.md §2.1.
#
# M1-2 (#2) performs the seam replacement in two ops:
#
#   1. disable the official backend row, so exactly one implementation of
#      ctx.compaction is live;
#   2. insert ours, which extends the class the disabled row used to mount
#      (lib/index.js imports @deepseek-ai/dsh-compaction-basic lazily, so the
#      package itself is still required at runtime — we override a row, we do
#      not vendor the backend).
#
# `command-compact` and `tool-result-pruner` stay untouched on purpose: they are
# backend-independent, so /compact and oversized tool-output pruning keep working.
#
# scripts/smoke-dumpconfig.sh asserts all three invariants (row disabled, our row
# mounted, no "patch: entry not found") against a throwaway DSH_HOME.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true
- insert:
    - id: compaction-codex
      name: 'dsh-compress-codex'
      config: {}
