name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The gate pipeline only reads the repository. Nothing here may need a token
# with write scope, and branch protection gates exactly these three contexts:
# ci / linux, ci / windows, ci / macos (docs/PLAN.md §4.3).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No install step by design: the test suite and lib/index.js must stay
      # runnable with zero node_modules, so the gate can never be blocked by a
      # registry outage or by a half-published @deepseek-ai prerelease.
      - name: Unit tests
        run: node --test "test/**/*.test.mjs"

      # The `runner` context only exists inside steps, never at job level.
      - name: Guard against touching a real DSH home
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/assert-isolated-home.mjs

      - name: Package dry run
        run: npm pack --dry-run

  # Node 22 is the oldest engine this package claims (package.json engines.node),
  # so the LTS job proves the declared floor rather than assuming it.
  lts:
    name: ci / node22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test "test/**/*.test.mjs"

      - name: Guard against touching a real DSH home
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/assert-isolated-home.mjs

      - name: Package dry run
        run: npm pack --dry-run

  # Assembly-level dump smoke (#2 / terminal-verification F5).
  #
  # SCOPE, so nobody merges the two smokes by accident:
  #   * this job  = ASSEMBLY. A composed profile mounts our row, the official
  #     compaction-basic row is disabled, ours is mounted, and the loader reports
  #     no unresolved patch target. No session, no model credentials.
  #   * scripts/smoke-runtime.mjs (#12/#39) = a REAL session through dsh@next, needs
  #     credentials. That one lives in compat.yml and is non-gating.
  #
  # Unlike every other job in this file, this one deliberately performs a registry
  # round trip, because the assembly smoke needs a real dsh binary. It is therefore
  # best-effort: if the install fails, the script prints "SMOKE RESULT: SKIPPED"
  # with the reason and exits 0, so a registry outage can never turn the gate red.
  # For the same reason it is NOT in the required status checks.
  dump-smoke:
    name: ci / dump-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Scoped package name on purpose: a bare `dsh` on npm is an unrelated
      # package with no `next` tag (see the note in compat.yml).
      - name: Install dsh and pnpm (best effort)
        continue-on-error: true
        run: |
          npm install --global --prefix "$RUNNER_TEMP/dsh-next" @deepseek-ai/dsh@next
          npm install --global pnpm

      - name: Assembly smoke
        env:
          DSH_BIN: ${{ runner.temp }}/dsh-next/bin/dsh
        run: bash scripts/smoke-dumpconfig.sh

  # Preset drift guard (task-23). NOT a required check: it needs a real dsh
  # install, so a registry outage must never turn the gate red. What it adds is
  # the one thing the zero-install jobs cannot see: whether the anchor recorded
  # in scripts/preset-anchors.json still matches the upstream preset this repo
  # generates preset-codex from (plus the generator's own reverse proofs).
  preset-drift:
    name: ci / preset-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Best effort on purpose: a registry outage downgrades this job to
      # INCOMPLETE (reported, never called PASS), it does not fail the gate.
      - name: Install the pinned dsh baseline (best effort)
        continue-on-error: true
        run: |
          BASELINE="$(node -p "require('./scripts/preset-anchors.json').baseline")"
          echo "installing @deepseek-ai/dsh@$BASELINE"
          npm install --global --prefix "$RUNNER_TEMP/dsh-anchor" "@deepseek-ai/dsh@$BASELINE"

      - name: Anchor check for the upstream preset
        env:
          DSH_BIN: ${{ runner.temp }}/dsh-anchor/bin/dsh
        run: bash scripts/preset-drift-check.sh

      # Reverse proofs: a tampered anchor, a simulated upstream change and a lost
      # retarget row must each fail, and a missing source must report INCOMPLETE.
      - name: Preset generator reverse proofs
        env:
          DSH_BIN: ${{ runner.temp }}/dsh-anchor/bin/dsh
        run: bash scripts/preset-drift-check.sh --selftest

      # Offline codex-ptc criteria (#62, docs/ci-codex-ptc.md). These are static
      # and composition facts about the generated preset: no credentials, no model
      # call, no real session — CI cannot run one (no secrets, and compat.yml opens
      # SMOKE_ALLOW_SKIP so A7 is always SKIP). The session-level criteria S1/S2
      # therefore stay unverified here and are reported as such, never as a pass.
      #
      # Deliberately a STEP, not a new job: it needs the same dsh install as the
      # anchor check above, and a separate job would pay the ~36s install again.
      # Deliberately NOT in the required checks: main is strict + enforce_admins,
      # so adding it would turn an upstream preset change into a merge blocker.
      #
      # The step asserts its own honesty: an INCOMPLETE verdict may not contain the
      # substring PASS, and each injected fault must turn the checker red.
      - name: Offline codex-ptc criteria (O1-O4)
        env:
          DSH_BIN: ${{ runner.temp }}/dsh-anchor/bin/dsh
        run: bash scripts/preset-drift-check.sh --offline
