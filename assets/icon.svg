<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Codex-style compaction for DeepSeek Harness">
  <title>Codex-style compaction</title>
  <desc>Expanded conversation history funnels into one durable checkpoint that the next turn resumes from.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="taper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- Expanded history: each older turn is narrower and fainter, i.e. already compressed. -->
  <g fill="url(#taper)">
    <rect x="13" y="12.5" width="30" height="3.6" rx="1.8" opacity="0.5"/>
    <rect x="16" y="20" width="26" height="3.6" rx="1.8" opacity="0.72"/>
    <rect x="19" y="27.5" width="22" height="3.6" rx="1.8" opacity="0.92"/>
  </g>

  <!-- The collapse: everything above funnels into the single node below. -->
  <path d="M23 35.5 32 43l9-7.5" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The checkpoint the next turn actually resumes from. -->
  <rect x="14" y="46.5" width="26" height="6.4" rx="3.2" fill="#ffffff"/>

  <!-- Resume: hand off and keep going from that checkpoint. -->
  <path d="M44 49.7h6.2m0 0-2.7-2.7m2.7 2.7-2.7 2.7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
</svg>
